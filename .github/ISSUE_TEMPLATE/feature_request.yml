name: Feature request
description: Suggest an improvement or a new data source
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [MILESTONE.md](https://github.com/Maryjane-nmesoma/tideline/blob/main/MILESTONE.md) first. Your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Where would the data come from?
      description: |
        Tideline reads live public sources only, with no mock data. Name the API, chain or contract, and whether it
        needs a key.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this
